quarkus:
  # Tracing OpenTelemetry. Mati kecuali OCR_TRACES_EXPORTER=otlp. Trace dari api dilanjutkan lewat traceparent di job.
  otel:
    service:
      name: ${OTEL_SERVICE_NAME:ms-ocr}
    traces:
      exporter: ${OCR_TRACES_EXPORTER:none}
    exporter:
      otlp:
        traces:
          endpoint: ${OCR_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
          protocol: http/protobuf
  http:
    port: 8080
    host: 0.0.0.0
    limits:
      # Batas body untuk /demo/extract (berkas maksimal 10 MB).
      max-body-size: 10M

  smallrye-health:
    root-path: /q/health
    liveness-path: /live
    readiness-path: /ready

  log:
    level: INFO
    category:
      "org.tettyrs":
        level: DEBUG

  rest-client:
    connect-timeout: 5000
    read-timeout: 30000

  redis:
    hosts: redis://${REDIS_HOST:redis}:${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}

# Alamat antar-service (docker network). Lihat api-spec bagian 8.
ocr:
  engine:
    url: ${OCR_ENGINE_URL:http://ocr-engine:8000}
  api:
    url: ${API_INTERNAL_URL:http://ocr-api:8080}
  # Nama tetap agar pesan pending tetap bisa dibaca setelah container dibuat ulang (HOSTNAME berubah).
  consumer-name: ${OCR_CONSUMER_NAME:ms-ocr-1}

internal:
  token: ${INTERNAL_TOKEN:}
