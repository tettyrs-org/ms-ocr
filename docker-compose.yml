# Standalone docker-compose untuk ms-ocr
# Gunakan: docker-compose -f ms-ocr/docker-compose.yml up
# Atau dari root: docker-compose -f ms-ocr/docker-compose.yml up

version: '3.8'

services:
  ms-ocr:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ms-ocr-standalone
    ports:
      - "8080:8080"
    environment:
      - QUARKUS_HTTP_HOST=0.0.0.0
      - QUARKUS_HTTP_PORT=8080
      - OCR_ENGINE_URL=${OCR_ENGINE_URL}
      - LOG_LEVEL=${LOG_LEVEL}
      - CORRECTOR_VERSION=${CORRECTOR_VERSION}
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
      - ./src/main/resources/correction:/app/correction-data
    networks:
      - ocr-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  ocr-network:
    driver: bridge
